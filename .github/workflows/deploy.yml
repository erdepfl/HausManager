name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp app/* _site/
          # Neue Cache-Version pro Deployment -> iPhones laden Updates zuverlässig
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
          grep -q "hausmanager-${GITHUB_SHA::8}" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
